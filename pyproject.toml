[project]
name = "tedlib"
version = "0.1.0"
description = "本地 TED 视频/音频播放器 (单文件 Python HTTP 服务 + HTML/JS 前端)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Pang" },
]
keywords = ["ted", "video", "audio", "player", "http-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.urls]
# 内部项目无远程链接，留空字段以便日后填入
Homepage = ""
Issues = ""

# ------------------------------------------------------------------
# uv 配置：这是脚本型项目 (单 .py + 静态 HTML)，不需要构建 wheel
# ------------------------------------------------------------------
[tool.uv]
package = false

# ------------------------------------------------------------------
# 依赖分组：未来可加 dev 工具 (ruff/pytest 等)
# ------------------------------------------------------------------
[dependency-groups]
dev = []
