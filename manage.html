<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容管理 · TED Learner</title><link rel="stylesheet" href="./assets/common.css">
<style>.manage-grid{display:grid;grid-template-columns:280px 1fr;gap:24px}.manage-panel{padding:20px}.folder-list{display:grid;gap:8px;max-height:70vh;overflow:auto}.folder-list button{text-align:left;overflow-wrap:anywhere}.metadata-form{display:grid;gap:16px}.metadata-form label{display:grid;gap:4px;color:var(--text-secondary)}.metadata-form input,.metadata-form textarea,.metadata-form select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.metadata-form textarea{min-height:95px}.form-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}#manageStatus{white-space:pre-wrap;overflow-wrap:anywhere;margin:16px 0}.folder-list .selected{border-color:var(--accent);background:var(--accent-soft)}[hidden]{display:none!important}@media(max-width:700px){.manage-grid,.form-pair{grid-template-columns:1fr}.folder-list{max-height:240px}}</style>
</head><body><main class="page"><h1 class="page-title">内容管理</h1><p class="page-sub">将媒体和带时间戳字幕放入 TED/ 下的目录，然后扫描、确认信息并导入。</p><button class="btn" id="scanFolders">重新扫描目录</button> <a class="btn" href="./library.html">查看视频库</a><div id="manageStatus" role="status" aria-live="polite"></div><div class="manage-grid"><aside class="panel manage-panel"><h2>媒体目录</h2><div class="folder-list" id="folderList"></div></aside><section class="panel manage-panel"><h2 id="formTitle">选择一个目录</h2><form class="metadata-form" id="metadataForm" hidden>
<label>媒体目录路径<input name="folder" required maxlength="255"></label><label>标题<input name="title" required maxlength="255"></label>
<div class="form-pair"><label>讲者<input name="speaker" maxlength="255"></label><label>分类<input name="category" maxlength="255"></label></div>
<label>媒体文件<select name="media_file" required></select></label><label>字幕文件<input name="transcript_file" required maxlength="255"></label>
<div class="form-pair"><label>发布时间（可留空）<input name="published" type="date"></label><label>下载日期（可留空）<input name="downloaded" type="date"></label></div>
<label>标签（用英文逗号分隔）<input name="tags"></label><label>来源链接<input name="youtube" type="url" maxlength="255"></label>
<label>中文摘要<textarea name="summary_zh" maxlength="6000"></textarea></label><label>英文摘要<textarea name="summary_en" maxlength="6000"></textarea></label>
<button class="btn btn-primary" id="saveVideo" type="submit">确认导入</button></form></section></div></main><script src="./assets/common.js"></script><script src="./assets/manage.js"></script></body></html>
