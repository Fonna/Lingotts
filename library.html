<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./assets/common.css">
<title>视频库 · TED Learner</title>
<style>
/* ===== CSS Variables: Dual Theme ===== */
:root {
  --bg: #faf7f2;
  --bg-secondary: #f3efe8;
  --card-bg: #fffdf8;
  --card-hover: #fffefc;
  --text: #3d2e1f;
  --text-secondary: #7a6b5c;
  --text-tertiary: #a89885;
  --accent: #d4784c;
  --accent-hover: #c06840;
  --accent-glow: rgba(212, 120, 76, 0.12);
  --accent-soft: rgba(212, 120, 76, 0.08);
  --border: #e8dfd3;
  --border-hover: #d4c8b6;
  --tag-bg: #f3efe8;
  --tag-text: #8b7355;
  --shadow-sm: 0 1px 3px rgba(61, 46, 31, 0.06);
  --shadow-md: 0 4px 16px rgba(61, 46, 31, 0.08);
  --shadow-lg: 0 12px 40px rgba(61, 46, 31, 0.10);
  --grain-opacity: 0.03;
  --gradient-header: linear-gradient(165deg, #f5ede0 0%, #faf7f2 40%, #efe5d8 100%);
  --card-badge-bg: rgba(212, 120, 76, 0.1);
  --card-badge-text: #b85d30;
}
[data-theme="cool"] {
  --bg: #0c0e14;
  --bg-secondary: #12151d;
  --card-bg: #181b25;
  --card-hover: #1c1f2a;
  --text: #e2e4eb;
  --text-secondary: #9398a8;
  --text-tertiary: #62687a;
  --accent: #8bafe0;
  --accent-hover: #7a9fd4;
  --accent-glow: rgba(139, 175, 224, 0.10);
  --accent-soft: rgba(139, 175, 224, 0.06);
  --border: #222636;
  --border-hover: #2e3348;
  --tag-bg: #1e2230;
  --tag-text: #8a90a8;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.18);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.35);
  --grain-opacity: 0.04;
  --gradient-header: linear-gradient(165deg, #141820 0%, #0c0e14 40%, #10141e 100%);
  --card-badge-bg: rgba(139, 175, 224, 0.12);
  --card-badge-text: #8bafe0;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.65;
  font-weight: 400;
  transition: background 0.5s ease, color 0.5s ease;
  -webkit-font-smoothing: antialiased;
}

/* ===== Grain Overlay (redesign_skill: surface upgrade) ===== */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  transition: opacity 0.5s ease;
}

/* ===== Header ===== */
.header {
  background: var(--gradient-header);
  border-bottom: 1px solid var(--border);
  padding: 56px 24px 44px;
  text-align: center;
  position: relative;
  transition: background 0.5s ease, border-color 0.5s ease;
}
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 1px;
  background: var(--accent);
  opacity: 0.3;
}
.header h1 {
  font-family: Georgia, serif;
  font-size: 2.8rem;
  font-weight: 400;
  letter-spacing: -0.5px;
  line-height: 1.15;
}
.header h1 span { color: var(--accent); font-style: italic; }
.header-subtitle {
  color: var(--text-secondary);
  margin-top: 10px;
  font-size: 1.05rem;
  font-weight: 400;
  letter-spacing: 0.3px;
}
.header-line {
  width: 48px; height: 2px;
  background: var(--accent);
  margin: 20px auto 0;
  border-radius: 1px;
  opacity: 0.5;
}

/* ===== Stats Bar ===== */
.stats-bar {
  display: flex; justify-content: center; gap: 40px;
  margin-top: 24px; flex-wrap: wrap;
}
.stat { text-align: center; }
.stat-num {
  font-family: Georgia, serif;
  font-size: 2rem; font-weight: 400;
  color: var(--accent); line-height: 1;
}
.stat-label {
  font-size: 0.72rem; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 1.8px; margin-top: 4px;
  font-weight: 500;
}

/* ===== Theme Toggle & Filters Row ===== */
.controls-row {
  display: flex; justify-content: center; align-items: center; gap: 16px;
  padding: 20px 24px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  transition: border-color 0.5s ease;
}
.theme-toggle {
  padding: 8px 16px; border: 1px solid var(--border);
  border-radius: 22px; background: var(--card-bg);
  color: var(--text); cursor: pointer;
  font-size: 0.85rem; font-weight: 500;
  transition: all 0.3s ease;
  font-family: sans-serif;
  white-space: nowrap;
}
.theme-toggle:hover { border-color: var(--accent); background: var(--accent-soft); }
.filter-btn {
  padding: 8px 18px; border: 1px solid var(--border);
  border-radius: 22px; background: transparent;
  color: var(--text-secondary); cursor: pointer;
  font-size: 0.85rem; font-weight: 500;
  transition: all 0.25s ease;
  font-family: sans-serif;
}
.filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
.filter-btn.active {
  background: var(--accent); border-color: var(--accent);
  color: #fff;
}

/* ===== Container & Grid ===== */
.container { max-width: 1280px; margin: 0 auto; padding: 36px 24px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 28px;
}

/* ===== Card (redesign_skill: tinted shadows, spotlight borders, staggered entry) ===== */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-sm);
  transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
              box-shadow 0.35s ease,
              border-color 0.35s ease,
              background 0.5s ease;
  position: relative;
  opacity: 0;
  transform: translateY(24px);
  animation: cardEnter 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.15s; }
.card:nth-child(3) { animation-delay: 0.25s; }
@keyframes cardEnter {
  to { opacity: 1; transform: translateY(0); }
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--border-hover);
  background: var(--card-hover);
}
.card::after {
  content: ''; position: absolute; inset: -1px; border-radius: 17px;
  padding: 1px;
  background: linear-gradient(145deg, transparent 60%, var(--accent) 150%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 0;
}
.card:hover::after { opacity: 0.25; }
.card > * { position: relative; z-index: 1; }

/* ===== Card Header ===== */
.card-header {
  padding: 28px 28px 18px;
  border-bottom: 1px solid var(--border);
  transition: border-color 0.5s ease;
}
.card-eyebrow {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.card-emoji {
  font-size: 1.8rem; line-height: 1;
  filter: drop-shadow(0 2px 4px var(--accent-glow));
}
.card-category {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
  color: var(--card-badge-text); font-weight: 600;
  background: var(--card-badge-bg);
  padding: 3px 12px; border-radius: 12px;
}
.card h3 {
  font-family: Georgia, serif;
  font-size: 1.25rem; font-weight: 400; line-height: 1.3;
  margin-bottom: 6px;
  text-wrap: balance;
}
.card-speaker {
  font-size: 0.88rem; color: var(--text-secondary); font-weight: 400;
}

/* ===== Card Body (Summaries) ===== */
.card-body { padding: 20px 28px; flex: 1; }
.summary-block { margin-bottom: 14px; }
.summary-block:last-child { margin-bottom: 0; }
.summary-lang {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.8px;
  color: var(--text-tertiary); font-weight: 600; margin-bottom: 4px;
}
.summary-text {
  font-size: 0.88rem; color: var(--text); line-height: 1.6;
  font-weight: 400;
}
.summary-text.en { color: var(--text-secondary); }

/* ===== Card Meta ===== */
.card-meta {
  padding: 14px 28px;
  display: flex; gap: 20px; flex-wrap: wrap;
  font-size: 0.8rem; color: var(--text-secondary);
  border-top: 1px solid var(--border);
  transition: border-color 0.5s ease;
}
.meta-item { display: flex; align-items: center; gap: 5px; }
.meta-icon { opacity: 0.6; font-size: 0.85rem; }
.meta-label { color: var(--text-tertiary); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 2px; }

/* ===== Tags ===== */
.card-tags { padding: 6px 28px 18px; display: flex; gap: 7px; flex-wrap: wrap; }
.tag {
  background: var(--tag-bg); color: var(--tag-text);
  padding: 4px 11px; border-radius: 10px;
  font-size: 0.72rem; font-weight: 500;
  transition: background 0.3s ease, color 0.3s ease;
}

/* ===== Actions ===== */
.card-actions { padding: 0 28px 24px; display: flex; gap: 10px; }
.btn {
  padding: 9px 18px; border-radius: 10px; font-size: 0.84rem;
  cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.25s ease; font-weight: 500;
  font-family: sans-serif;
  border: 1px solid var(--border);
  background: transparent; color: var(--text);
}
.btn:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
  box-shadow: 0 2px 8px var(--accent-glow);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-yt {
  color: var(--text-secondary);
  border-color: transparent;
  font-size: 0.78rem; padding: 6px 12px;
}
.btn-yt:hover { color: #ff0000; border-color: rgba(255,0,0,0.2); background: rgba(255,0,0,0.05); }

/* ===== Footer ===== */
.footer {
  text-align: center; padding: 40px 24px;
  color: var(--text-tertiary); font-size: 0.82rem;
  border-top: 1px solid var(--border);
  margin-top: 24px;
  transition: border-color 0.5s ease, color 0.5s ease;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 2rem; }
  .header { padding: 40px 20px 32px; }
  .stats-bar { gap: 24px; }
}
</style>
</head>
<body data-theme="warm">
<header class="header"><h1>TED<span> Talks</span> Library</h1><p class="header-subtitle">选择一段演讲，开始学习</p><div class="header-line"></div>
<div class="stats-bar"><div class="stat"><div class="stat-num" id="talkCount">–</div><div class="stat-label">Talks</div></div><div class="stat"><div class="stat-num" id="categoryCount">–</div><div class="stat-label">Categories</div></div></div></header>
<div class="controls-row"><button class="theme-toggle" onclick="App.toggleTheme(this)">切换主题</button><label for="librarySearch">搜索</label><input class="search-input" id="librarySearch" type="search" placeholder="标题、讲者、标签或摘要"><label for="categoryFilter">分类</label><select class="search-input" id="categoryFilter"><option value="all">全部分类</option></select><a class="btn" href="./manage.html">管理视频库</a></div>
<div class="container"><p id="catalogIssues" role="status"></p><p id="visibleCount" role="status"></p><div class="grid" id="cardGrid">正在读取视频库…</div></div>
<footer class="footer">TED Learner · 内容导入后自动更新</footer><script src="./assets/common.js"></script><script src="./assets/library.js"></script></body></html>
